<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>市场参与者图鉴</title>
<meta name="description" content="20 类市场参与者的工作方式与交易过程图示">
<meta name="theme-color" content="#f2ede5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1b17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="市场图鉴">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/lxgwwenkaigbscreen/result.min.css">
<link rel="stylesheet" href="fonts/lxgwwenkaimonogbscreen/result.min.css">
<style>
/* 布局：左侧固定索引（按市场层级分组）＋ 右侧一次只看一个参与者；窄屏时索引变成顶部下拉。
   配色沿用「慢慢联系」：燕麦（默认）/ 暮紫，各有浅深两套；不用纯白纯黑，无动画，实线边框。 */
:root {
  --bg: #f2ede5;
  --surface: #faf7f2;
  --surface-2: #ece5da;
  --text: #3a332b;
  --muted: #675e52;
  --border: #e0d6c7;
  --accent: #7e6447;
  --accent-text: #faf7f2;
  --accent-soft: #ebe1d3;
  --accent-strong: #5e4a34;
  --other: #5f7a94;          /* 第二色：卖方 / 对比序列（灰蓝） */
  --other-soft: #e2e6e9;
  --warn: #9a7a35;
  --illo-ink: #8c7b66;
  --illo-fill: #e8dcc9;
  --font-body: 'LXGW WenKai GB Screen', 'LXGW WenKai Screen', 'LXGW WenKai', 'LXGW WenKai TC', 'Kaiti SC', 'STKaiti', -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
  --font-data: 'LXGW WenKai Mono GB Screen', 'LXGW WenKai Mono TC', 'LXGW WenKai Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-s: 0.8125rem;
  --fs-m: 0.9375rem;
  --fs-b: 1rem;
  --fs-l: 1.1875rem;
  --fs-xl: 1.5rem;
  --fs-xxl: 1.875rem;
  --r: 8px;
  color-scheme: light;
}
:root[data-palette="dusk"] {
  --bg: #eeecf1; --surface: #f8f7fa; --surface-2: #e6e3ec; --text: #322f3a; --muted: #625e75;
  --border: #dcd8e3; --accent: #645e80; --accent-text: #f8f7fa; --accent-soft: #e3e0ec; --accent-strong: #4a4563;
  --other: #5c7f8f; --other-soft: #e0e7ea; --warn: #8f7738; --illo-ink: #7d7896; --illo-fill: #dfdbea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1b17; --surface: #27231e; --surface-2: #312c26; --text: #ded6ca; --muted: #b3a898;
    --border: #3d372f; --accent: #a99174; --accent-text: #1f1913; --accent-soft: #3a3128; --accent-strong: #e3cfb2;
    --other: #8fa7bd; --other-soft: #2c333a; --warn: #c4a765; --illo-ink: #a8977f; --illo-fill: #3a3128;
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-palette="dusk"] {
    --bg: #1b1a20; --surface: #24232b; --surface-2: #2e2c36; --text: #dad7e1; --muted: #ada8bc;
    --border: #3a3845; --accent: #9890b8; --accent-text: #1c1a24; --accent-soft: #34314a; --accent-strong: #d3cdea;
    --other: #8fb0bd; --other-soft: #2a3238; --warn: #c2a768; --illo-ink: #8f89aa; --illo-fill: #34314a;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1b17; --surface: #27231e; --surface-2: #312c26; --text: #ded6ca; --muted: #b3a898;
  --border: #3d372f; --accent: #a99174; --accent-text: #1f1913; --accent-soft: #3a3128; --accent-strong: #e3cfb2;
  --other: #8fa7bd; --other-soft: #2c333a; --warn: #c4a765; --illo-ink: #a8977f; --illo-fill: #3a3128;
  color-scheme: dark;
}
:root[data-theme="dark"][data-palette="dusk"] {
  --bg: #1b1a20; --surface: #24232b; --surface-2: #2e2c36; --text: #dad7e1; --muted: #ada8bc;
  --border: #3a3845; --accent: #9890b8; --accent-text: #1c1a24; --accent-soft: #34314a; --accent-strong: #d3cdea;
  --other: #8fb0bd; --other-soft: #2a3238; --warn: #c2a768; --illo-ink: #8f89aa; --illo-fill: #34314a;
}
:root[data-font="large"] { font-size: 18.5px; }

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
*, *::before, *::after { box-sizing: border-box; animation: none !important; scroll-behavior: auto !important; }
body {
  margin: 0; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: var(--fs-b); line-height: 1.7; letter-spacing: 0.01em;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent-strong); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--other); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; margin: 0; font-weight: 700; }
p { margin: 0; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; max-width: 1180px; margin: 0 auto; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 18px 16px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand a { color: var(--text); text-decoration: none; font-size: var(--fs-l); font-weight: 700; }
.brand .sub { color: var(--muted); font-size: var(--fs-s); }
.prefs { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: var(--fs-s); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: var(--fs-s); color: var(--text); background: transparent; border: 0; padding: 4px 12px; min-height: 30px; cursor: pointer; }
@media (pointer: coarse) { .seg button { min-height: 36px; padding: 4px 14px; } .btn { min-height: 40px; } }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.pref { display: flex; align-items: center; gap: 8px; }

.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 40px; padding-top: 24px; }
.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 4px; }
.index h3 { font-size: var(--fs-s); color: var(--muted); font-weight: 400; letter-spacing: 0.08em; margin-bottom: 4px; }
.index ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.index a { display: block; padding: 3px 10px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: var(--fs-m); }
.index a:hover { background: var(--surface-2); }
.index a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; }
.picker { display: none; }

main { min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
#content { display: flex; flex-direction: column; gap: 36px; min-width: 0; }
.crumb { font-size: var(--fs-s); color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 10px; }
.head h1 { font-size: var(--fs-xxl); }
.head .en { font-family: var(--font-data); color: var(--muted); font-size: var(--fs-s); letter-spacing: 0.04em; }
.lead { font-size: var(--fs-l); line-height: 1.65; max-width: 38em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: var(--fs-s); border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 1px 10px; color: var(--muted); }
.chip b { color: var(--text); font-weight: 400; }

section { display: flex; flex-direction: column; gap: 14px; }
section > h2 { font-size: var(--fs-l); display: flex; align-items: baseline; gap: 10px; }
section > h2 .tag { font-size: var(--fs-s); font-weight: 400; color: var(--muted); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 40em; }
.note { font-size: var(--fs-s); color: var(--muted); max-width: 46em; }

.diagram { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.diagram svg { display: block; }
.lane text { font-family: var(--font-body); font-size: 13px; fill: var(--text); }
.lane .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.lane .ln-h { fill: var(--surface-2); stroke: var(--border); }
.lane .ln-l { stroke: var(--border); stroke-width: 1.5; }
.lane .ln-row { stroke: var(--surface-2); stroke-width: 1; }
.lane .ln-a { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.lane .ah { fill: var(--accent); }
.lane .ln-s { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.lane .ln-nc { fill: var(--bg); stroke: var(--border); }
.lane .ln-n { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
ol.steps { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 4px; max-width: 44em; font-size: var(--fs-m); }
ol.steps li::marker { font-family: var(--font-data); color: var(--muted); }
ol.steps .sn { color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.panel .status { font-size: var(--fs-s); color: var(--muted); }
.btn { font: inherit; font-size: var(--fs-m); padding: 5px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer; }
.btn.quiet { background: transparent; color: var(--accent-strong); border-color: var(--border); }
.btn:disabled { opacity: 0.45; cursor: default; }
.msg { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; font-size: var(--fs-m); min-height: 4.6em; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-s); }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 400; white-space: nowrap; }
td.r, th.r { text-align: right; }
td.num, td.r { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr.hl td { background: var(--accent-soft); }
tr.dim td { color: var(--muted); }
.buy { color: var(--accent-strong); }
.sell { color: var(--other); }
.okv { color: var(--accent-strong); }
.warnv { color: var(--warn); }
.cell-bar { display: flex; align-items: center; gap: 8px; }
.cell-bar span.b { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; }
.ord { display: inline-block; font-family: var(--font-data); font-size: 12px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin: 1px 2px; background: var(--bg); white-space: nowrap; }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-s); }
.qlist li { display: flex; gap: 10px; }
.qlist .st { width: 4.5em; flex: none; color: var(--muted); }
.qlist li.cur { color: var(--accent-strong); }
.qlist li.cur .st { color: var(--accent-strong); }
.ctrl { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 4.5em; align-items: center; gap: 4px 10px; font-size: var(--fs-s); }
.ctrl input[type="range"] { width: 100%; accent-color: var(--accent); }
.ctrl output { font-family: var(--font-data); text-align: right; }
input[type="number"] { font: inherit; font-family: var(--font-data); width: 7em; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.formula { font-family: var(--font-data); font-size: var(--fs-s); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; line-height: 1.8; overflow-x: auto; white-space: nowrap; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { font-family: var(--font-body); font-size: 12px; fill: var(--muted); }
svg.chart .t-strong { fill: var(--text); }
svg.chart .grid { stroke: var(--surface-2); stroke-width: 1; }
svg.chart .axis { stroke: var(--border); stroke-width: 1; }
.ems { font-family: var(--font-data); font-size: 12.5px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.ems .row { display: grid; grid-template-columns: repeat(7, minmax(max-content, 1fr)); gap: 0 14px; padding: 6px 10px; overflow-x: auto; }
.ems .row.h { background: var(--surface-2); color: var(--muted); }
.prog { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--accent); }

dl.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 0; }
dl.two > div { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
dl.two dt { font-size: var(--fs-s); color: var(--muted); }
dl.two dd { margin: 0; font-size: var(--fs-m); }
ul.rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; max-width: 44em; font-size: var(--fs-m); }
ul.rules .d { font-family: var(--font-data); font-size: var(--fs-s); color: var(--muted); margin-right: 6px; }
dl.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: 10px 24px; margin: 0; }
dl.terms div { border-top: 1px solid var(--border); padding-top: 6px; }
dl.terms dt { font-weight: 700; font-size: var(--fs-m); }
dl.terms dd { margin: 0; font-size: var(--fs-s); color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font-size: var(--fs-m); border: 1px solid var(--border); background: var(--surface); padding: 2px 12px; border-radius: 6px; text-decoration: none; }
.links a:hover { background: var(--surface-2); }
.src { font-size: var(--fs-s); color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.pager { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--border); padding-top: 16px; font-size: var(--fs-m); }
.pager a { text-decoration: none; }

/* 总览 */
.ov-head { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 24px; align-items: center; }
.ov-head h1 { font-size: var(--fs-xxl); }
.ov-head .illo { width: 150px; height: auto; }
.map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.map .col { padding: 14px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--border); position: relative; }
.map .col:last-child { border-right: 0; }
.map .col h3 { font-size: var(--fs-m); }
.map .col .what { font-size: var(--fs-s); color: var(--muted); min-height: 3.4em; }
.map .col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.map .col a { display: block; font-size: var(--fs-m); text-decoration: none; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; background: var(--bg); }
.map .col a:hover { border-color: var(--accent); }
.map .col a small { display: block; color: var(--muted); font-size: 12px; }
.map .base { grid-column: 1 / -1; border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--surface-2); }
.map .base h3 { font-size: var(--fs-m); }
.map .base a { font-size: var(--fs-m); text-decoration: none; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; background: var(--bg); }
.flowline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: var(--fs-s); color: var(--muted); }
.flowline span { padding: 0 14px; }
.axes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.axes > div { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.axes h3 { font-size: var(--fs-m); }
.axes p { font-size: var(--fs-s); color: var(--muted); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 16px; }
  .index { display: none; }
  .picker { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-s); color: var(--muted); }
  .picker select { font: inherit; font-size: var(--fs-b); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  .map { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .map .col:nth-child(2) { border-right: 0; }
  .map .col:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
  .flowline { display: none; }
}
@media (max-width: 560px) {
  .grid2, dl.two, .axes { grid-template-columns: minmax(0, 1fr); }
  .map { grid-template-columns: minmax(0, 1fr); }
  .map .col { border-right: 0; border-bottom: 1px solid var(--border); }
  .ov-head { grid-template-columns: minmax(0, 1fr); }
  .ov-head .illo { display: none; }
  .head h1, .ov-head h1 { font-size: var(--fs-xl); }
  .ctrl { grid-template-columns: 6.5em minmax(0, 1fr) 4em; }
}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand"><a href="#overview">市场参与者图鉴</a><span class="sub">20 类参与者 · 规则资料核对至 2026-11-04 · 示例数字均为虚构</span></div>
    <div class="prefs">
      <div class="pref"><span id="lbl-pal">配色</span><div class="seg" role="group" aria-labelledby="lbl-pal"><button type="button" id="pal-oat" data-pal="oat">燕麦</button><button type="button" id="pal-dusk" data-pal="dusk">暮紫</button></div></div>
      <div class="pref"><span id="lbl-theme">深浅</span><div class="seg" role="group" aria-labelledby="lbl-theme"><button type="button" id="theme-system" data-theme-pick="system">跟随系统</button><button type="button" id="theme-light" data-theme-pick="light">浅</button><button type="button" id="theme-dark" data-theme-pick="dark">深</button></div></div>
      <div class="pref"><span id="lbl-font">字号</span><div class="seg" role="group" aria-labelledby="lbl-font"><button type="button" id="font-normal" data-font="normal">标准</button><button type="button" id="font-large" data-font="large">大</button></div></div>
    </div>
  </header>
  <div class="layout">
    <nav class="index" id="index" aria-label="参与者目录"></nav>
    <main id="view">
      <div class="picker"><label for="picker">选择参与者</label><select id="picker"></select></div>
      <div id="content"></div>
    </main>
  </div>
</div>

<script>
'use strict';
const GROUPS = [
  ['P', '一级市场', '证券第一次卖给投资者：融资、发行、申购'],
  ['X', '交易所与二级市场', '已发行证券在交易所里连续买卖'],
  ['O', '场外与批发市场', '机构之间点对点询价，大额、非标准'],
  ['C', '大宗商品', '实货贸易与期货：价格、物流、对冲'],
  ['I', '基础设施与政策', '成交之后的结算，以及央行的流动性操作']
];

const E = [
/* ---------- 一级市场 ---------- */
{ id: 'vcpe', g: 'P', name: '风险投资与私募股权', en: 'VC / PE', role: '资金提供者', auto: '以人工为主',

  try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
}

/* ---------- 泳道图（交易过程） ---------- */
function laneSvg(f) {
  const n = f.lanes.length, LW = 158, PX = 40, HH = 48, SH = 46;
  const W = PX + n * LW + 8, H = HH + 22 + f.steps.length * SH;
  const cx = i => PX + LW * i + LW / 2;
  let s = `<svg class="lane" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="交易步骤图：${f.lanes.join('、')}">`;
  s += '<defs><marker id="ah-lane" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker></defs>';
  f.steps.forEach((st, i) => { const y = HH + 26 + i * SH; s += `<line class="ln-row" x1="30" x2="${W - 4}" y1="${y + SH / 2}" y2="${y + SH / 2}"/>`; });
  f.lanes.forEach((l, i) => {
    s += `<line class="ln-l" x1="${cx(i)}" x2="${cx(i)}" y1="40" y2="${H - 6}"/>`;
    s += `<rect class="ln-h" x="${cx(i) - 70}" y="6" width="140" height="34" rx="6"/><text x="${cx(i)}" y="28" text-anchor="middle">${l}</text>`;
  });
  f.steps.forEach((st, i) => {
    const [a, b, label] = st; const y = HH + 26 + i * SH;
    s += `<circle class="ln-nc" cx="16" cy="${y}" r="10"/><text class="ln-n" x="16" y="${y + 4}" text-anchor="middle">${i + 1}</text>`;
    if (a === b) {
      s += `<rect class="ln-s" x="${cx(a) - 6}" y="${y - 6}" width="12" height="12" rx="2"/>`;
      const last = a === n - 1 && n > 1;
      s += `<text class="halo" x="${last ? cx(a) - 14 : cx(a) + 14}" y="${y + 4.5}" text-anchor="${last ? 'end' : 'start'}">${label}</text>`;
    } else {
      const dir = b > a ? 1 : -1;
      s += `<line class="ln-a" x1="${cx(a) + dir * 6}" x2="${cx(b) - dir * 8}" y1="${y}" y2="${y}" marker-end="url(#ah-lane)"/>`;
      s += `<circle cx="${cx(a)}" cy="${y}" r="3" style="fill:var(--accent)"/>`;
      s += `<text class="halo" x="${(cx(a) + cx(b)) / 2}" y="${y - 8}" text-anchor="middle">${label}</text>`;
    }
  });
  return s + '</svg>';
}

function entry(e) {
  const idx = E.indexOf(e), prev = E[idx - 1], next = E[idx + 1];
  let h = `<div class="head"><p class="crumb">${groupName[e.g]}</p><h1>${e.name}</h1><p class="en">${e.en}</p>
    <p class="lead">${e.one}</p>
    <div class="chips"><span class="chip">角色：<b>${e.role}</b></span><span class="chip">自动化：<b>${e.auto}</b></span></div></div>`;
  h += `<section><h2>具体怎么工作</h2><div class="prose">${e.does.map(p => `<p>${p}</p>`).join('')}</div></section>`;
  h += `<section><h2>一笔交易怎么走 <span class="tag">${e.flow.steps.length} 步 · 横向为参与方，纵向为先后顺序</span></h2>
    <div class="diagram">${laneSvg(e.flow)}</div>
    <ol class="steps">${e.flow.steps.map(s => `<li>${s[2]}${s[3] ? `<span class="sn">：${s[3]}</span>` : ''}</li>`).join('')}</ol></section>`;
  (e.widgets || []).forEach(([title, fn], i) => { h += `<section><h2>${title}</h2><div class="panel" id="w-${fn}"></div></section>`; });
  if (e.example) {
    const x = e.example;
    h += `<section><h2>${x.caption}</h2><div class="panel tbl-wrap"><table><thead><tr>${x.head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${x.rows.map(r => `<tr>${r.map((c, j) => `<td${j ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  }
  h += `<section><h2>收入与风险</h2><dl class="two"><div><dt>怎么赚钱</dt><dd>${e.money}</dd></div><div><dt>主要风险</dt><dd>${e.risk}</dd></div></dl></section>`;
  if (e.cn) h += `<section><h2>具体规则与数字</h2><ul class="rules">${e.cn.map(([d, t]) => `<li>${d ? `<span class="d">${d}</span>` : ''}${t}</li>`).join('')}</ul></section>`;
  h += `<section><h2>术语</h2><dl class="terms">${e.terms.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl></section>`;
  h += `<section><h2>相关参与者</h2><div class="links">${e.related.map(r => `<a href="#${r}">${byId[r].name}</a>`).join('')}</div></section>`;
  if (e.src) h += `<div class="src"><span>资料来源</span>${e.src.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join('')}</div>`;
  h += `<nav class="pager" aria-label="上一个和下一个">${prev ? `<a href="#${prev.id}">上一个：${prev.name}</a>` : '<a href="#overview">返回总览</a>'}${next ? `<a href="#${next.id}">下一个：${next.name}</a>` : '<a href="#overview">返回总览</a>'}</nav>`;
  return h;
}

function route(scroll) {
  const id = (location.hash || '#overview').slice(1);
  const e = byId[id];
  $('#content').innerHTML = e ? entry(e) : overview();
  const cur = e ? id : 'overview';
  document.querySelectorAll('#index a').forEach(a => { if (a.dataset.id === cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#picker').value = e ? id : 'overview';
  if (e) (e.widgets || []).forEach(([, fn]) => W[fn]($('#w-' + fn)));
  if (scroll) window.scrollTo(0, 0);
}

const W = {};

/* 撮合引擎 */
W.matcher = el => {
  const QUEUE = [
    { id: 'B4', side: 'B', type: 'L', px: 10.04, n: 600, why: '买价 10.04 高于卖一 10.03，可以成交。先吃最低的卖价，再吃 10.04；10.04 上 S2 比 S3 先到，所以先和 S2 成交（时间优先）。' },
    { id: 'S5', side: 'S', type: 'L', px: 10.02, n: 300, why: '卖价 10.02 高于买一 10.01，不能成交，挂在卖方 10.02，成为新的卖一。' },
    { id: 'B5', side: 'B', type: 'L', px: 10.01, n: 200, why: '买价 10.01 低于卖一 10.02，不能成交，挂在 10.01，排在更早到达的 B1 后面。' },
    { id: 'S6', side: 'S', type: 'M', n: 900, why: '市价卖单（最优五档即时成交剩余撤销）：从买一往下依次成交。10.01 上先成交 B1，再成交 B5。' },
    { id: 'B6', side: 'B', type: 'L', px: 10.06, n: 800, why: '买价 10.06 高于所有卖价，从 10.02 开始逐档成交；卖方全部吃完后还剩 100 股，挂在买方 10.06。' }
  ];
  const init = () => ({
    asks: [{ px: 10.03, q: [{ id: 'S4', n: 200 }] }, { px: 10.04, q: [{ id: 'S2', n: 200 }, { id: 'S3', n: 300 }] }, { px: 10.05, q: [{ id: 'S1', n: 300 }] }],
    bids: [{ px: 10.01, q: [{ id: 'B1', n: 400 }] }, { px: 10.00, q: [{ id: 'B2', n: 600 }] }, { px: 9.99, q: [{ id: 'B3', n: 300 }] }],
    i: 0, trades: [], touched: new Set(), msg: '这是 9:30 之后某一时刻的订单簿（虚构）。每点一次“处理下一笔订单”，引擎处理队列里的一笔新订单。'
  });
  let st = init();
  const desc = o => `${o.id} ${o.type === 'M' ? '市价' : '限价'}${o.side === 'B' ? '买入' : '卖出'} ${fmt(o.n)} 股${o.type === 'L' ? ' @ ' + o.px.toFixed(2) : ''}`;
  function proc(o) {
    st.touched = new Set();
    const opp = o.side === 'B' ? st.asks : st.bids;
    let left = o.n, used = 0; const mine = [];
    const crosses = L => o.type === 'M' || (o.side === 'B' ? L.px <= o.px + 1e-9 : L.px >= o.px - 1e-9);
    while (left > 0 && opp.length && crosses(opp[0]) && used < 5) {
      const L = opp[0]; st.touched.add(L.px.toFixed(2));
      while (left > 0 && L.q.length) {
        const r = L.q[0], x = Math.min(left, r.n);
        r.n -= x; left -= x;
        const t = { px: L.px, n: x, b: o.side === 'B' ? o.id : r.id, s: o.side === 'B' ? r.id : o.id };
        st.trades.push(t); mine.push(t);
        if (r.n === 0) L.q.shift();
      }
      if (!L.q.length) { opp.shift(); used++; }
    }
    let tail = '';
    if (left > 0 && o.type === 'L') {
      const own = o.side === 'B' ? st.bids : st.asks;
      let L = own.find(l => Math.abs(l.px - o.px) < 1e-9);
      if (!L) { L = { px: o.px, q: [] }; own.push(L); own.sort((a, b) => o.side === 'B' ? b.px - a.px : a.px - b.px); }
      L.q.push({ id: o.id, n: left }); st.touched.add(o.px.toFixed(2));
      tail = `剩余 ${fmt(left)} 股挂在${o.side === 'B' ? '买' : '卖'}方 ${o.px.toFixed(2)}。`;
    } else if (left > 0) tail = `剩余 ${fmt(left)} 股撤销。`;
    else tail = '全部成交。';
    const byPx = {}; mine.forEach(t => { byPx[t.px.toFixed(2)] = (byPx[t.px.toFixed(2)] || 0) + t.n; });
    const done = Object.entries(byPx).map(([p, n]) => `${p} 成交 ${fmt(n)} 股`).join('，');
    st.msg = `<b>${desc(o)}</b><br>${done ? '结果：' + done + '。' : '结果：没有成交。'}${tail}<br><span class="note">${o.why}</span>`;
  }
  function render() {
    const prices = [...new Set([...st.asks, ...st.bids].map(l => l.px.toFixed(2)))].sort((a, b) => b - a);
    const cell = (side, p) => { const L = side.find(l => l.px.toFixed(2) === p); return L ? L.q.map(r => `<span class="ord">${r.id}·${r.n}</span>`).join('') : ''; };
    const sum = (side, p) => { const L = side.find(l => l.px.toFixed(2) === p); return L ? fmt(L.q.reduce((a, r) => a + r.n, 0)) : ''; };
    const book = `<table><thead><tr><th>卖方挂单（订单号·股数）</th><th class="r">卖量</th><th class="r">价格</th><th class="r">买量</th><th>买方挂单</th></tr></thead><tbody>${prices.map(p => `<tr class="${st.touched.has(p) ? 'hl' : ''}"><td>${cell(st.asks, p)}</td><td class="r sell">${sum(st.asks, p)}</td><td class="r"><b>${p}</b></td><td class="r buy">${sum(st.bids, p)}</td><td>${cell(st.bids, p)}</td></tr>`).join('')}</tbody></table>`;
    const q = `<ul class="qlist">${QUEUE.map((o, k) => `<li class="${k === st.i ? 'cur' : ''}"><span class="st">${k < st.i ? '已处理' : k === st.i ? '下一笔' : '等待'}</span><span class="mono">${desc(o)}</span></li>`).join('')}</ul>`;
    const tr = st.trades.length ? `<table><thead><tr><th class="r">#</th><th class="r">价格</th><th class="r">股数</th><th>买方订单</th><th>卖方订单</th></tr></thead><tbody>${st.trades.map((t, k) => `<tr><td class="r">${k + 1}</td><td class="r">${t.px.toFixed(2)}</td><td class="r">${fmt(t.n)}</td><td class="mono">${t.b}</td><td class="mono">${t.s}</td></tr>`).join('')}</tbody></table>` : '<p class="note">还没有成交。</p>';
    el.innerHTML = `<div class="bar"><button class="btn" id="m-next" type="button" ${st.i >= QUEUE.length ? 'disabled' : ''}>处理下一笔订单</button><button class="btn quiet" id="m-reset" type="button">重新开始</button><span class="status">已处理 ${st.i} / ${QUEUE.length} 笔 · 成交 ${st.trades.length} 次</span></div>
      <div class="msg">${st.msg}</div>
      <div class="tbl-wrap">${book}</div>
      <div class="grid2"><div><p class="note">订单队列</p>${q}</div><div class="tbl-wrap"><p class="note">成交记录</p>${tr}</div></div>
      <p class="note">高亮行是这一步变化的价位。买卖量按订单到达顺序从左到右排列。</p>`;
    el.querySelector('#m-next').onclick = () => { if (st.i < QUEUE.length) { proc(QUEUE[st.i]); st.i++; render(); } };
    el.querySelector('#m-reset').onclick = () => { st = init(); render(); };
  }
  render();
};

/* 集合竞价 */
W.auction = el => {
  const prev = 10.00;
  let bigQty = 300;
  function calc() {
    const buys = [[10.10, 200], [10.08, bigQty], [10.05, 500], [10.03, 400], [10.00, 600]];
    const sells = [[9.98, 300], [10.00, 400], [10.03, 500], [10.05, 300], [10.08, 600]];
    const ps = [...new Set([...buys, ...sells].map(x => x[0]))].sort((a, b) => b - a);
    const rows = ps.map(p => {
      const B = buys.filter(x => x[0] >= p - 1e-9).reduce((a, x) => a + x[1], 0);
      const S = sells.filter(x => x[0] <= p + 1e-9).reduce((a, x) => a + x[1], 0);
      return { p, B, S, v: Math.min(B, S), u: Math.abs(B - S) };
    });
    const best = rows.slice().sort((a, b) => b.v - a.v || a.u - b.u || Math.abs(a.p - prev) - Math.abs(b.p - prev))[0];
    return { buys, sells, rows, best };
  }
  function render() {
    const { buys, sells, rows, best } = calc();
    const maxV = Math.max(...rows.map(r => r.v), 1);
    const p = best.p;
    const bAbove = buys.filter(x => x[0] > p + 1e-9).reduce((a, x) => a + x[1], 0);
    const sBelow = sells.filter(x => x[0] < p - 1e-9).reduce((a, x) => a + x[1], 0);
    const bAt = buys.filter(x => Math.abs(x[0] - p) < 1e-9).reduce((a, x) => a + x[1], 0);
    const sAt = sells.filter(x => Math.abs(x[0] - p) < 1e-9).reduce((a, x) => a + x[1], 0);
    const fb = best.v - bAbove, fs = best.v - sBelow;
    const ord = (arr, cls) => arr.map(([px, n]) => `<tr><td class="r ${cls}">${px.toFixed(2)}</td><td class="r">${fmt(n)}</td></tr>`).join('');
    el.innerHTML = `<div class="bar"><label for="auc-q" class="note">修改 10.08 元买单的股数</label><input type="number" id="auc-q" min="0" max="5000" step="100" value="${bigQty}"><span class="status">前收盘价 10.00 · 9:25 时的全部订单（虚构）</span></div>
      <div class="grid2"><div class="tbl-wrap"><table><thead><tr><th class="r">买单价格</th><th class="r">股数</th></tr></thead><tbody>${ord(buys, 'buy')}</tbody></table></div>
      <div class="tbl-wrap"><table><thead><tr><th class="r">卖单价格</th><th class="r">股数</th></tr></thead><tbody>${ord(sells, 'sell')}</tbody></table></div></div>
      <div class="tbl-wrap"><table><thead><tr><th class="r">候选价格</th><th class="r">累计买量（≥ 该价）</th><th class="r">累计卖量（≤ 该价）</th><th>可成交量</th><th class="r">未匹配量</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${r === best ? 'hl' : ''}"><td class="r"><b>${r.p.toFixed(2)}</b></td><td class="r buy">${fmt(r.B)}</td><td class="r sell">${fmt(r.S)}</td><td><div class="cell-bar"><span class="b" style="width:${Math.round(r.v / maxV * 120)}px"></span><span class="num">${fmt(r.v)}</span></div></td><td class="r">${fmt(r.u)}</td></tr>`).join('')}</tbody></table></div>
      <div class="msg"><b>开盘价 ${p.toFixed(2)} 元，成交 ${fmt(best.v)} 股。</b><br>高于 ${p.toFixed(2)} 的买单（${fmt(bAbove)} 股）全部成交；低于 ${p.toFixed(2)} 的卖单（${fmt(sBelow)} 股）全部成交。在 ${p.toFixed(2)} 这一价位，买方成交 ${fmt(fb)} / ${fmt(bAt)} 股，卖方成交 ${fmt(fs)} / ${fmt(sAt)} 股。<br><span class="note">多个价格可成交量相同时，本示例取未匹配量最小的价格，再取最接近前收盘价的价格；各交易所的具体规则以其交易规则为准。</span></div>`;
    const inp = el.querySelector('#auc-q');
    inp.addEventListener('change', () => { const v = Math.max(0, Math.min(5000, Math.round((+inp.value || 0) / 100) * 100)); bigQty = v; render(); el.querySelector('#auc-q').focus(); });
  }
  render();
};

/* 做市报价（Avellaneda–Stoikov） */
W.mm = el => {
  const s = 100;
  const v = { q: 0, sig: 1.5, g: 0.1, k: 1.5 };
  el.innerHTML = `<div class="grid2"><div class="ctrl">
      <label for="mm-q">库存（手）</label><input type="range" id="mm-q" min="-5" max="5" step="1" value="0"><output id="mm-qo"></output>
      <label for="mm-s">波动率 σ</label><input type="range" id="mm-s" min="0.5" max="2.5" step="0.1" value="1.5"><output id="mm-so"></output>
      <label for="mm-g">风险厌恶 γ</label><input type="range" id="mm-g" min="0.02" max="0.2" step="0.01" value="0.1"><output id="mm-go"></output>
      <label for="mm-k">订单到达 k</label><input type="range" id="mm-k" min="0.5" max="3" step="0.1" value="1.5"><output id="mm-ko"></output>
    </div><div class="formula">保留价格 r = s − q·γ·σ²<br>总价差 δ = γ·σ² + (2/γ)·ln(1 + γ/k)<br>买价 = r − δ/2　卖价 = r + δ/2</div></div>
    <div class="grid2"><div id="mm-chart"></div><div class="tbl-wrap" id="mm-tbl"></div></div>
    <p class="note">模型来自 Avellaneda 与 Stoikov（2008），这里取剩余时间 T − t = 1，中间价 s = 100.00。实际做市程序还会加入订单流方向、对冲成本和交易所报价义务。</p>`;
  const ids = { q: 'mm-q', sig: 'mm-s', g: 'mm-g', k: 'mm-k' };
  function upd() {
    const { q, sig, g, k } = v;
    const r = s - q * g * sig * sig;
    const d = g * sig * sig + (2 / g) * Math.log(1 + g / k);
    const bid = r - d / 2, ask = r + d / 2, pct = d / s * 100;
    el.querySelector('#mm-qo').textContent = (q > 0 ? '+' : '') + q;
    el.querySelector('#mm-so').textContent = sig.toFixed(1);
    el.querySelector('#mm-go').textContent = g.toFixed(2);
    el.querySelector('#mm-ko').textContent = k.toFixed(1);
    const lo = Math.floor(Math.min(bid, s) - 0.6), hi = Math.ceil(Math.max(ask, s) + 0.6);
    const H = 260, top = 14, bot = 18, Wd = 320;
    const y = p => top + (hi - p) / (hi - lo) * (H - top - bot);
    let g2 = '';
    const step = (hi - lo) > 8 ? 2 : 1;
    for (let p = lo; p <= hi; p += step) g2 += `<line class="grid" x1="44" x2="${Wd - 6}" y1="${y(p)}" y2="${y(p)}"/><text x="38" y="${y(p) + 4}" text-anchor="end" class="num">${p}</text>`;
    const line = (p, color, lbl, w) => `<line x1="56" x2="190" y1="${y(p)}" y2="${y(p)}" style="stroke:${color};stroke-width:${w}"/><text x="198" y="${y(p) + 4}" class="t-strong">${lbl} ${p.toFixed(2)}</text>`;
    const band = `<rect x="56" y="${y(ask)}" width="134" height="${Math.max(1, y(bid) - y(ask))}" style="fill:var(--accent-soft)"/>`;
    el.querySelector('#mm-chart').innerHTML = `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="报价示意：买价 ${bid.toFixed(2)}，卖价 ${ask.toFixed(2)}">${g2}${band}${line(ask, 'var(--other)', '卖价', 2.4)}${line(s, 'var(--muted)', '中间价', 1)}${line(r, 'var(--accent-strong)', '保留价', 1.4)}${line(bid, 'var(--accent)', '买价', 2.4)}</svg>`;
    const ok = pct <= 2;
    el.querySelector('#mm-tbl').innerHTML = `<table><thead><tr><th>报价面板（示例股票）</th><th class="r">数值</th></tr></thead><tbody>
      <tr><td>中间价</td><td class="r">${s.toFixed(2)}</td></tr>
      <tr><td>库存</td><td class="r">${(q > 0 ? '+' : '') + q} 手</td></tr>
      <tr><td>保留价格</td><td class="r">${r.toFixed(2)}</td></tr>
      <tr class="hl"><td class="buy">买价</td><td class="r buy">${bid.toFixed(2)}</td></tr>
      <tr class="hl"><td class="sell">卖价</td><td class="r sell">${ask.toFixed(2)}</td></tr>
      <tr><td>价差 / 价差率</td><td class="r">${d.toFixed(2)} / ${pct.toFixed(2)}%</td></tr>

/* 债券招标 */
W.tender = el => {
  const SIZE = 300;
  const bids = [['A 行', 1.80, 60], ['B 行', 1.82, 80], ['C 券商', 1.83, 50], ['D 行', 1.85, 70], ['E 行', 1.86, 60], ['F 行', 1.88, 90], ['G 券商', 1.90, 40]];
  let mode = 'dutch';
  let cum = 0; const alloc = bids.map(([n, r, a]) => { const x = Math.max(0, Math.min(a, SIZE - cum)); cum += a; return x; });
  const won = alloc.map((x, i) => [bids[i], x]).filter(([, x]) => x > 0);
  const marginal = won[won.length - 1][0][1];
  const wavg = won.reduce((s, [b, x]) => s + b[1] * x, 0) / SIZE;
  function render() {
    const cost = (r) => mode === 'dutch' ? marginal : mode === 'us' ? r : (r <= wavg + 1e-9 ? wavg : r);
    const coupon = mode === 'dutch' ? marginal : wavg;
    const rows = bids.map(([n, r, a], i) => { const x = alloc[i]; return `<tr class="${x > 0 ? '' : 'dim'}"><td>${n}</td><td class="r">${r.toFixed(2)}%</td><td class="r">${a}</td><td class="r">${x > 0 ? fmt(x, x % 1 ? 1 : 0) : '0'}</td><td class="r">${x > 0 ? cost(r).toFixed(2) + '%' : '—'}</td><td>${x > 0 ? (mode === 'mixed' ? (r <= wavg + 1e-9 ? '按面值' : '低于面值') : '') : '未中标'}</td></tr>`; }).join('');
    const expl = { dutch: `荷兰式（单一价格）：所有中标者都按边际中标利率 ${marginal.toFixed(2)}% 认购，票面利率 ${marginal.toFixed(2)}%。投标者愿意报更低的利率，因为最终按统一利率成交。`,
      us: `美国式（多重价格）：每个中标者按自己的投标利率认购。票面利率取全场加权平均中标利率 ${wavg.toFixed(2)}%，投标利率高于它的机构按折价认购。报价激进的机构承担更低的收益率。`,
      mixed: `混合式：票面利率为全场加权平均中标利率 ${wavg.toFixed(2)}%。投标利率不高于它的标位按面值认购；高于它的标位按各自的中标利率折算价格认购（低于面值）。` }[mode];
    el.innerHTML = `<div class="bar"><div class="seg" role="group" aria-label="招标方式"><button type="button" id="td-d" aria-pressed="${mode === 'dutch'}">荷兰式</button><button type="button" id="td-u" aria-pressed="${mode === 'us'}">美国式</button><button type="button" id="td-m" aria-pressed="${mode === 'mixed'}">混合式</button></div><span class="status">计划发行 300 亿元 · 投标 450 亿元 · 全场倍数 1.50 · 虚构数据</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>投标人</th><th class="r">投标利率</th><th class="r">投标量（亿）</th><th class="r">中标量（亿）</th><th class="r">实际认购利率</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="msg"><b>票面利率 ${coupon.toFixed(2)}%。</b> 边际中标利率 ${marginal.toFixed(2)}%：累计到 E 行时达到 300 亿，E 行投标 60 亿只中标 40 亿。<br>${expl}</div>`;
    el.querySelector('#td-d').onclick = () => { mode = 'dutch'; render(); };
    el.querySelector('#td-u').onclick = () => { mode = 'us'; render(); };
    el.querySelector('#td-m').onclick = () => { mode = 'mixed'; render(); };
  }
  render();
};

/* IPO 询价簿 */
W.ipoBook = el => {
  const book = [[22.50, 30], [22.20, 40], [21.80, 120], [21.50, 300], [21.20, 800], [21.00, 1500], [20.80, 2100], [20.60, 1800], [20.40, 1300], [20.20, 900], [20.00, 700], [19.50, 400], [19.00, 200], [18.00, 100]];
  const total = book.reduce((a, b) => a + b[1], 0);
  let pct = 1;
  function render() {
    let rm = total * pct / 100;
    const rows = book.map(([p, q]) => { const cut = Math.min(q, rm); rm -= cut; return { p, q, cut, keep: q - cut }; });
    const kept = rows.filter(r => r.keep > 0);
    const kq = kept.reduce((a, r) => a + r.keep, 0);
    const wavg = kept.reduce((a, r) => a + r.p * r.keep, 0) / kq;
    let acc = 0, median = 0; for (const r of kept.slice().sort((a, b) => a.p - b.p)) { acc += r.keep; if (acc >= kq / 2) { median = r.p; break; } }
    const price = Math.floor(Math.min(median, wavg) * 100) / 100;
    const Wd = 640, rowH = 20, X0 = 64, H = book.length * rowH + 30, sc = (Wd - X0 - 70) / 2100;
    let s = '';
    [0, 500, 1000, 1500, 2000].forEach(t => { s += `<line class="grid" x1="${X0 + t * sc}" x2="${X0 + t * sc}" y1="4" y2="${H - 22}"/><text x="${X0 + t * sc}" y="${H - 6}" text-anchor="middle" class="num">${t}</text>`; });
    rows.forEach((r, i) => {
      const y = 6 + i * rowH;
      const valid = r.p >= price - 1e-9;
      s += `<text x="${X0 - 8}" y="${y + 12}" text-anchor="end" class="num ${valid ? 't-strong' : ''}">${r.p.toFixed(2)}</text>`;
      if (r.keep > 0) s += `<rect x="${X0}" y="${y}" width="${r.keep * sc}" height="14" rx="2" style="fill:${valid ? 'var(--accent)' : 'var(--surface-2)'};stroke:${valid ? 'none' : 'var(--border)'}"/>`;
      if (r.cut > 0) s += `<rect x="${X0 + r.keep * sc}" y="${y}" width="${Math.max(r.cut * sc, 2)}" height="14" rx="2" style="fill:var(--other-soft);stroke:var(--other)"/>`;
      s += `<text x="${X0 + r.q * sc + 6}" y="${y + 12}" class="num">${fmt(r.q)}${r.cut > 0 ? '（剔除 ' + fmt(r.cut, r.cut % 1 ? 1 : 0) + '）' : ''}</text>`;
    });
    const yP = 6 + rows.findIndex(r => r.p < price - 1e-9) * rowH - 3;
    s += `<line x1="${X0 - 50}" x2="${Wd - 8}" y1="${yP}" y2="${yP}" style="stroke:var(--accent-strong);stroke-width:1.4"/><text x="${Wd - 8}" y="${yP - 4}" text-anchor="end" class="t-strong">发行价 ${price.toFixed(2)}</text>`;
    s += `<text x="${X0}" y="${H - 6}" dx="-56" class="num">万股</text>`;
    el.innerHTML = `<div class="bar"><div class="seg" role="group" aria-label="剔除比例"><button type="button" id="ib-1" aria-pressed="${pct === 1}">剔除 1%</button><button type="button" id="ib-3" aria-pressed="${pct === 3}">剔除 3%</button></div><span class="status">网下拟申购总量 ${fmt(total)} 万股 · 每行是一个报价价位 · 虚构数据</span></div>
      <svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="询价簿条形图">${s}</svg>
      <div class="msg">从最高价开始剔除拟申购总量的 ${pct}%（${fmt(total * pct / 100, 1)} 万股）。剩余报价的中位数 ${median.toFixed(2)} 元、加权平均数 ${wavg.toFixed(2)} 元。本例取两者中较低者作为发行价 ${price.toFixed(2)} 元：深色为有效报价，浅色为低于发行价未入围的报价，灰蓝框为被剔除的部分。</div>
      <p class="note">实际定价还要参考可比公司估值、行业市盈率，以及公募、社保、养老金、年金、保险等长期投资者报价的中位数和加权平均数；发行价超过这些数值时需要额外披露。</p>`;
    el.querySelector('#ib-1').onclick = () => { pct = 1; render(); };
    el.querySelector('#ib-3').onclick = () => { pct = 3; render(); };
  }
  render();
};

        ${!ba.length && !bb.length ? '<tr><td colspan="3" class="note">暂无</td></tr>' : ''}</tbody></table>
        <p class="note" style="margin-top:8px">${trade ? `最后成交：${trade[1]} 从 ${trade[2]} 买入 1 个 partial @ ${trade[3].toFixed(2)}` : '尚无成交'}${closed ? '<br><b class="okv">评估价 70.30</b>' : ''}</p></div></div>
      <p class="note">窗口内的买卖报价必须公开、可执行，报价方被接受时有义务成交。同一对手方累计成交 20 个 partial（500,000 桶）后，卖方需交付一整船原油。</p>`;
    el.querySelector('#pl-next').onclick = () => { if (i < EV.length) { i++; render(); } };
    el.querySelector('#pl-reset').onclick = () => { i = 0; render(); };
  }
  render();
};

/* 实货 + 期货对冲 */
W.oilHedge = el => {
  const BBL = 600000, F0 = 75.00, buyPrem = 1.20, sellPrem = 1.85;
  let F1 = 71.00;
  el.innerHTML = `<div class="ctrl" style="grid-template-columns: 10em minmax(0,1fr) 5em"><label for="oh-f">卖出时的 Brent 价格</label><input type="range" id="oh-f" min="60" max="90" step="0.5" value="71"><output id="oh-fo"></output></div><div class="tbl-wrap" id="oh-t"></div><p class="note" id="oh-n"></p>`;
  function upd() {
    const buy = F0 + buyPrem, sell = F1 + sellPrem;
    const phys = (sell - buy) * BBL, fut = (F0 - F1) * BBL, net = phys + fut;
    const m = v => (v >= 0 ? '+' : '−') + fmt(Math.abs(v)) + ' 美元';
    el.querySelector('#oh-fo').textContent = F1.toFixed(1);
    el.querySelector('#oh-t').innerHTML = `<table><thead><tr><th></th><th class="r">买入时</th><th class="r">卖出时</th><th class="r">盈亏</th></tr></thead><tbody>
      <tr><td>Brent 期货</td><td class="r">${F0.toFixed(2)}</td><td class="r">${F1.toFixed(2)}</td><td></td></tr>
      <tr><td>实货：600,000 桶</td><td class="r">买 ${buy.toFixed(2)}（+${buyPrem.toFixed(2)}）</td><td class="r">卖 ${sell.toFixed(2)}（+${sellPrem.toFixed(2)}）</td><td class="r">${m(phys)}</td></tr>
      <tr><td>期货：卖出 600 手后买回</td><td class="r">卖 ${F0.toFixed(2)}</td><td class="r">买 ${F1.toFixed(2)}</td><td class="r">${m(fut)}</td></tr>
      <tr class="hl"><td><b>合计</b></td><td></td><td></td><td class="r"><b>${m(net)}</b></td></tr></tbody></table>`;
    el.querySelector('#oh-n').textContent = `拖动滑块改变油价，合计始终是 (1.85 − 1.20) × 600,000 = 390,000 美元。对冲之后，交易员的利润只取决于升贴水之差；运费、仓储、融资成本还要从中扣除。1 手 Brent 期货 = 1,000 桶。`;
  }
  el.querySelector('#oh-f').addEventListener('input', ev => { F1 = +ev.target.value; upd(); });
  upd();
};

/* 基差 */
W.basis = el => {
  const T = 1000, F0 = 75500, S0 = 75000, B0 = S0 - F0;
  let F1 = 70300, B1 = -300;
  el.innerHTML = `<div class="ctrl" style="grid-template-columns: 10em minmax(0,1fr) 5.5em">
      <label for="bs-f">3 个月后期货价</label><input type="range" id="bs-f" min="60000" max="85000" step="100" value="70300"><output id="bs-fo"></output>
      <label for="bs-b">3 个月后基差</label><input type="range" id="bs-b" min="-1200" max="800" step="50" value="-300"><output id="bs-bo"></output></div>
    <div class="tbl-wrap" id="bs-t"></div><p class="note" id="bs-n"></p>`;
  function upd() {
    const S1 = F1 + B1;
    const spot = (S1 - S0) * T, fut = (F0 - F1) * T, net = spot + fut;
    const m = v => (v >= 0 ? '+' : '−') + fmt(Math.abs(v)) + ' 元';
    el.querySelector('#bs-fo').textContent = fmt(F1);
    el.querySelector('#bs-bo').textContent = (B1 > 0 ? '+' : '') + fmt(B1);
    el.querySelector('#bs-t').innerHTML = `<table><thead><tr><th>铜（元/吨）</th><th class="r">现在</th><th class="r">3 个月后</th><th class="r">1000 吨盈亏</th></tr></thead><tbody>
      <tr><td>现货价</td><td class="r">${fmt(S0)}</td><td class="r">${fmt(S1)}</td><td class="r">${m(spot)}（相对现在卖出）</td></tr>
      <tr><td>期货价（卖出后买回）</td><td class="r">${fmt(F0)}</td><td class="r">${fmt(F1)}</td><td class="r">${m(fut)}</td></tr>
      <tr><td>基差 = 现货 − 期货</td><td class="r">${fmt(B0)}</td><td class="r">${fmt(B1)}</td><td></td></tr>
      <tr class="hl"><td><b>套保后合计</b></td><td></td><td></td><td class="r"><b>${m(net)}</b></td></tr></tbody></table>`;
    el.querySelector('#bs-n').textContent = `合计 = (期末基差 − 期初基差) × 1000 吨 = (${B1} − (${B0})) × 1000。改变期货价格不影响合计，只有基差变化会影响。基差${B1 > B0 ? '走强，对卖出套保有利' : B1 < B0 ? '走弱，对卖出套保不利' : '不变，价格风险被完全对冲'}。`;
  }
  el.querySelector('#bs-f').addEventListener('input', ev => { F1 = +ev.target.value; upd(); });
  el.querySelector('#bs-b').addEventListener('input', ev => { B1 = +ev.target.value; upd(); });
  upd();
};

/* CTA */
W.cta = el => {
  let a = 7; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const P = [100]; for (let d = 1; d < 260; d++) { const dr = d < 90 ? 0.18 : d < 160 ? -0.24 : d < 200 ? 0 : 0.22; P.push(P[d - 1] + dr + gauss() * 0.9); }
  const ma = n => P.map((_, i) => i < n - 1 ? null : P.slice(i - n + 1, i + 1).reduce((x, y) => x + y, 0) / n);
  const m20 = ma(20), m60 = ma(60);
  const D0 = 60, D1 = 259;
  const pos = P.map((_, i) => i < D0 ? 0 : (m20[i] > m60[i] ? 1 : -1));
  let flips = 0; for (let i = D0 + 1; i <= D1; i++) if (pos[i] !== pos[i - 1]) flips++;
  const sl = P.slice(D0); const lo = Math.floor(Math.min(...sl) / 5) * 5, hi = Math.ceil(Math.max(...sl) / 5) * 5;
  const Wd = 640, X0 = 40, X1 = Wd - 70, top = 10, ph = 200, pTop = ph + 30, pH = 34;
  const x = i => X0 + (i - D0) / (D1 - D0) * (X1 - X0);
  const y = v => top + (hi - v) / (hi - lo) * (ph - top);
  const path = arr => arr.map((v, i) => i < D0 || v == null ? '' : `${i === D0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  let s = '';
  for (let v = lo; v <= hi; v += 10) s += `<line class="grid" x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}"/><text x="${X0 - 6}" y="${y(v) + 4}" text-anchor="end" class="num">${v}</text>`;
  s += `<path d="${path(P)}" style="fill:none;stroke:var(--muted);stroke-width:1"/>`;
  s += `<path d="${path(m60)}" style="fill:none;stroke:var(--other);stroke-width:2"/>`;
  s += `<path d="${path(m20)}" style="fill:none;stroke:var(--accent);stroke-width:2"/>`;
  s += `<text x="${X1 + 6}" y="${y(m20[D1]) + (m20[D1] > m60[D1] ? -2 : 10)}" class="t-strong">20 日线</text><text x="${X1 + 6}" y="${y(m60[D1]) + (m20[D1] > m60[D1] ? 10 : -2)}">60 日线</text>`;
  let segs = ''; let st = D0;
  for (let i = D0 + 1; i <= D1 + 1; i++) if (i > D1 || pos[i] !== pos[st]) { segs += `<rect x="${x(st)}" y="${pos[st] > 0 ? pTop : pTop + pH / 2}" width="${x(Math.min(i, D1)) - x(st)}" height="${pH / 2}" style="fill:${pos[st] > 0 ? 'var(--accent)' : 'var(--other)'}"/>`; st = i; }
  s += `<line class="axis" x1="${X0}" x2="${X1}" y1="${pTop + pH / 2}" y2="${pTop + pH / 2}"/>${segs}<text x="${X0 - 6}" y="${pTop + 12}" text-anchor="end">多</text><text x="${X0 - 6}" y="${pTop + pH - 3}" text-anchor="end">空</text>`;
  s += `<text x="${X0}" y="${pTop + pH + 18}" class="num">第 ${D0} 天</text><text x="${X1}" y="${pTop + pH + 18}" text-anchor="end" class="num">第 ${D1} 天</text>`;
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${Wd} ${pTop + pH + 26}" role="img" aria-label="价格、20 日线、60 日线和多空持仓">${s}</svg>
    <p class="note">虚构的期货价格（细灰线）：先上涨、再下跌、横盘、再上涨。20 日线在 60 日线之上时持多（上方色块），之下时持空（下方色块）。这段时间方向切换 ${flips} 次，横盘阶段的切换就是震荡磨损的来源。</p>`;
};

buildIndex();
route(false);
window.addEventListener('hashchange', () => route(true));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
